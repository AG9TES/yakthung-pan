<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#064e3b"/>
      <stop offset="50%" stop-color="#047857"/>
      <stop offset="100%" stop-color="#022c22"/>
    </linearGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fde047"/>
      <stop offset="50%" stop-color="#fbbf24"/>
      <stop offset="100%" stop-color="#d97706"/>
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="130%" height="130%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#000" flood-opacity="0.45"/>
    </filter>
  </defs>

  <!-- Background Squircle -->
  <rect width="512" height="512" rx="112" fill="#0B131E"/>
  
  <!-- Outer Gold Dhaka Ring -->
  <rect x="24" y="24" width="464" height="464" rx="96" fill="url(#bgGrad)" stroke="url(#goldGrad)" stroke-width="8"/>
  <rect x="40" y="40" width="432" height="432" rx="84" fill="none" stroke="#fbbf24" stroke-width="2" stroke-dasharray="10 8" opacity="0.6"/>

  <!-- Center Glow -->
  <circle cx="256" cy="240" r="160" fill="#10b981" opacity="0.15" filter="url(#shadow)"/>

  <!-- Sirijonga Letter Ka (ᤁ) Path / Text representation -->
  <g filter="url(#shadow)">
    <!-- Sirijonga Ka glyph rendered with distinct authentic calligraphic strokes -->
    <path d="M 180 160 H 332" stroke="url(#goldGrad)" stroke-width="32" stroke-linecap="round"/>
    <path d="M 256 160 V 340" stroke="url(#goldGrad)" stroke-width="32" stroke-linecap="round"/>
    <path d="M 256 240 C 210 240, 175 270, 175 315 C 175 355, 210 380, 256 380 C 302 380, 337 355, 337 315 C 337 270, 302 240, 256 240 Z" fill="none" stroke="url(#goldGrad)" stroke-width="28" stroke-linecap="round" stroke-linejoin="round"/>
  </g>

  <!-- Title pill -->
  <rect x="116" y="416" width="280" height="46" rx="23" fill="#0B131E" stroke="#fbbf24" stroke-width="2"/>
  <text x="256" y="445" font-family="system-ui, -apple-system, sans-serif" font-size="20" font-weight="800" fill="#f8fafc" text-anchor="middle" letter-spacing="3">YAKTHUNG PAN</text>
</svg>